[project]
name = "ufc-fight-predictions"
version = "0.1.0"
description = "UFC fight predictor"
readme = "README.md"
authors = [
    { name = "sotomarcos24", email = "sotomarcos24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false
